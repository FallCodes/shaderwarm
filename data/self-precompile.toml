# Games that compile their own shaders/pipelines up front (on first launch, at startup or
# on a loading screen), so shaderwarm adds little for them.
#
# Unreal Engine 5 games never belong here: UE5's PSO precaching misses most pipelines,
# so they still benefit from recording and replay.
#
# Override or extend this list in ~/.config/shaderwarm/self-precompile.toml with the
# same format; `self_compiles = false` un-flags a game listed here.

